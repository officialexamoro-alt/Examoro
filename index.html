<style>
:root{--ink:#0f1b3d;--mute:#5a6783;--line:#e4e9f2;--blue:#1d4ed8;--soft:#f4f7fd;--red:#d62828;box-sizing:border-box}
*{box-sizing:border-box}html{scroll-behavior:auto}
body{margin:0;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{max-width:100%;-webkit-user-drag:none;pointer-events:none}
a{color:var(--blue)}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
section{scroll-margin-top:84px;padding:46px 0}
.bar{background:#fff;border-bottom:1px solid var(--line);text-align:center;padding:10px 12px;font-family:'Noto Sans Devanagari','Mukta',Arial,sans-serif;font-size:clamp(23px,6.2vw,38px);font-weight:800;line-height:1.35;white-space:nowrap;overflow:hidden}.bar i{display:inline-block;width:clamp(14px,5vw,60px);height:3px;vertical-align:middle;margin:0 10px;border-radius:3px;background:linear-gradient(90deg,#0b0b0b,#d62828)}.bar .c1{color:#0b0b0b}.bar .c2{color:#d62828}

header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand img{height:44px;width:44px}
.brand b{font-size:24px;font-weight:900;letter-spacing:3px}.brand b i{font-style:normal;color:var(--red)}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:4px}
nav a{display:block;padding:9px 13px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:bold;font-size:14px}
nav a:hover{background:var(--soft);color:var(--blue)}
#mb{display:none;background:var(--soft);border:0;width:42px;height:42px;border-radius:10px;font-size:20px;cursor:pointer;color:var(--ink)}
.btn{display:inline-block;border:0;border-radius:10px;padding:13px 24px;font:inherit;font-weight:bold;cursor:pointer;text-decoration:none;text-align:center}
.red{background:var(--red);color:#fff;box-shadow:0 8px 18px rgba(214,40,40,.28)}.red:hover{filter:brightness(1.07)}
.line{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.wa{background:#25d366;color:#fff}
:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
.hero{padding:44px 0 36px;background:#fff}
.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.chip{display:inline-block;background:#e6eeff;color:var(--blue);font-weight:bold;font-size:12px;letter-spacing:.8px;padding:6px 14px;border-radius:20px}
h1{font-size:clamp(30px,5vw,50px);line-height:1.12;margin:14px 0 12px;font-weight:900}h1 em{font-style:normal;color:var(--blue)}
.lead{color:var(--mute);font-size:17px;max-width:480px;margin:0 0 22px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.price{font-size:30px;font-weight:900}.price s{font-size:0}
.stage{perspective:1000px;display:flex;justify-content:center;align-items:center;padding:38px 20px;border-radius:26px;background:#fff}
.b3{width:min(210px,54vw);position:relative}.b3::after{content:"";position:absolute;left:12%;right:4%;bottom:-2%;height:7%;background:radial-gradient(ellipse at center,rgba(15,27,61,.28),transparent 70%);filter:blur(7px);z-index:-1}
.b3 img{width:100%;display:block}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:-6px}
.trust div{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;box-shadow:0 6px 18px rgba(15,27,61,.05)}
.trust b{display:block}.trust small{color:var(--mute)}
h2{font-size:28px;margin:0 0 6px;font-weight:900}.sub{color:var(--mute);margin:0 0 22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.cat{background:#fff;border:1px solid #d5ddec;color:var(--ink);border-radius:20px;padding:8px 16px;font:inherit;font-weight:bold;font-size:13px;cursor:pointer}
.cat.on,.cat:hover{background:var(--blue);border-color:var(--blue);color:#fff}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;box-shadow:0 8px 24px rgba(15,27,61,.07);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;gap:8px}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(15,27,61,.13)}
.card img{display:block;width:100%}
.card h3{font-size:15px;margin:6px 0 0}.card p{margin:0;font-size:13px;color:var(--mute)}
.card .btn{padding:10px;font-size:14px;width:100%}
#msg{display:none;background:#fff7e0;border-radius:10px;padding:14px;color:#6b5200;margin-top:14px}
.alt{background:var(--soft)}
details{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:0 16px}
summary{cursor:pointer;font-weight:bold;padding:15px 0}
details>div{padding-bottom:16px}
.nr{background:#fdeaea;color:#a01616;font-weight:bold;border-radius:8px;padding:10px 14px;margin-bottom:10px}
footer{background:var(--ink);color:#c9d3ec;padding:34px 0 calc(34px + env(safe-area-inset-bottom,0px));font-size:13px;text-align:center}
footer a{color:#7ee7a8}.strip{margin-top:14px;color:#fff;font-weight:bold;font-size:15px}
#md{position:fixed;inset:0;z-index:60;background:rgba(10,18,40,.8);display:none;align-items:center;justify-content:center;padding:14px}
#md.on{display:flex}#md div{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:14px}
@media(max-width:760px){
#mb{display:block}nav{display:none;position:absolute;left:0;right:0;top:68px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 14px 24px rgba(15,27,61,.1)}nav.on{display:block}nav ul{flex-direction:column;padding:8px 14px}
.hg{grid-template-columns:1fr}.stage{order:-1}.trust{grid-template-columns:1fr}#list{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* what's inside */
.stage{padding:22px 20px}
.fx{display:grid;grid-template-columns:1fr 150px 1fr;gap:10px;align-items:stretch;max-width:760px;margin:0 auto}
.fx .col{display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.fx .bk{display:flex;align-items:center}.fx .bk img{width:100%;display:block}
.fi{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px;box-shadow:0 6px 16px rgba(15,27,61,.06)}
.fi div{flex:1;min-width:0}.fi b{display:block;font-size:14px;line-height:1.25}.fi small{display:block;font-size:12px;color:var(--mute);line-height:1.3;margin-top:2px}
.fi.l div{text-align:right}
.fi i{flex:0 0 26px;height:2px;background:var(--red);position:relative}
.fi.l i::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:8px solid var(--red);border-right:0}
.fi.r i::after{content:"";position:absolute;left:-1px;top:-4px;border:5px solid transparent;border-right:8px solid var(--red);border-left:0}
.fi em{font-style:normal;font-weight:900;color:var(--blue);font-size:13px}
@media(max-width:600px){.fx{grid-template-columns:1fr 112px 1fr;gap:6px}.fi{padding:7px 6px;gap:4px;border-radius:10px}.fi b{font-size:11.5px}.fi small{display:none}.fi i{flex-basis:12px}.fi em{display:none}}

.soc{display:flex;flex-wrap:wrap;gap:12px}
.soc a{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:bold;text-decoration:none;color:var(--ink);box-shadow:0 6px 16px rgba(15,27,61,.06);transition:transform .15s,box-shadow .15s}
.soc a:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(15,27,61,.12)}
.soc a::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}

.ss{background:#ffd23f;color:#141414;font-weight:800;font-style:italic;font-size:13px;line-height:1.15;padding:5px 11px;border-radius:7px;transform:rotate(-3deg);box-shadow:0 2px 0 rgba(0,0,0,.14);letter-spacing:.2px;white-space:nowrap}
@media(max-width:520px){.ss{font-size:10px;padding:4px 7px;letter-spacing:0}.ss span{display:block}.brand b{font-size:19px;letter-spacing:2px}.brand{gap:7px}.brand img{height:38px;width:38px}}

.cv{position:relative}.lk{position:absolute;inset:0;background:rgba(10,18,40,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;font-weight:800;letter-spacing:1.5px;font-size:13px}
.card details{border:0;background:none;padding:0;margin:0}.card.soon summary{padding:6px 0;font-size:13px;color:var(--blue)}.card.soon ul{margin:0 0 8px;padding-left:18px;color:var(--mute);font-size:12.5px;line-height:1.5}
.card .btn[disabled]{cursor:not-allowed}


.two{display:flex;gap:6px}.two .btn{flex:1;min-width:0;padding:9px 3px;font-size:11px;line-height:1.15;white-space:normal;text-align:center;display:flex;align-items:center;justify-content:center;gap:4px}.card .btn.line[disabled]{opacity:.7}

#list{align-items:stretch}.card{height:100%}
.cv img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover}
.card.soon .cv img{border-radius:4px;box-shadow:0 8px 18px rgba(15,27,61,.3)}.card.soon .lk{border-radius:4px}
.card h3{min-height:3.2em}.card p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:4.8em}
.card .price{font-size:22px;font-weight:900}.card .two{margin-top:auto}
.card details summary{padding:6px 0;font-size:13px;color:var(--blue)}.card ul{margin:0 0 8px;padding-left:18px;color:var(--mute);font-size:12.5px;line-height:1.5}
.card .two{flex-direction:column;gap:8px}.card .two .btn{flex:none;width:100%;padding:11px 8px;font-size:14px;white-space:nowrap;line-height:1.2}
.card.soon .cv{transform:scale(.965)}

/* official icons */
.trust>div{display:flex;align-items:center;gap:12px}
.ti{flex:0 0 44px;height:44px;border-radius:12px;background:#eaf1ff;color:var(--blue);display:grid;place-items:center}
.tx b,.tx small{display:block}
.soc a::before{display:none}
.soc .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#f1f5fb;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.btn svg{vertical-align:-4px;margin-right:4px}.two .btn svg{margin:0}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:0 0 8px;width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .2s;margin-top:-3px}
details[open]>summary::after{transform:rotate(-135deg);margin-top:3px}
.card details summary{justify-content:flex-start}.card details summary::after{margin-left:4px}
/* compact hero */
.hero{padding:22px 0 18px}.hg{gap:14px}.stage{padding:6px 20px}.b3{width:min(150px,40vw)}
.chip{font-size:11px;padding:5px 12px}h1{font-size:clamp(24px,6.4vw,34px);margin:10px 0 8px}.lead{font-size:14px;margin:0 0 14px}
.hero .btn{padding:10px 18px;font-size:14px}.hero .price{font-size:24px}
@media(min-width:761px){.b3{width:200px}h1{font-size:38px}}
/* compact social */
#social{padding:28px 0}#social h2{font-size:22px}#social .sub{font-size:13px;margin-bottom:14px}
.soc{gap:8px}.soc a{gap:7px;padding:6px 12px 6px 6px;border-radius:10px;font-size:13px;box-shadow:0 3px 10px rgba(15,27,61,.06)}
.soc .ic{width:28px;height:28px;border-radius:8px}.soc .ic svg{width:15px;height:15px}
.soc{gap:6px;flex-wrap:nowrap}.soc a{gap:5px;padding:5px 9px 5px 5px;font-size:12.5px;white-space:nowrap}
@media(max-width:380px){.soc{gap:5px}.soc a{font-size:12px;padding:4px 7px 4px 4px;gap:4px}.soc .ic{width:24px;height:24px}.soc .ic svg{width:13px;height:13px}}
